# Study card: 20 ha mixed crop-livestock farm, Tier-2 vs Tier-3 models.
#
# One file = one reproducible study: the farm reference, the reference
# models of every process, the model variants to test and the
# Monte-Carlo plan all live here. Run it with:
#
#     pblca run cards/studies/ferme_20ha.toml

[study]
name = "ferme_20ha"
# Farm card by name (resolved against cards/farms/) or by path.
farm = "ferme_20ha"
# Reference variant of the paired enteric-variant analysis: every
# alternative is reported as a paired difference against it.
main_enteric_variant = "tier2_fao_ym_modelled_ingestion"

# Reference models of the central run — EXPLICIT for every process.
# Use `pblca slots` to list every available variant of each slot.
[model_selection]
# Layer 1 — agronomic processes
enteric_ch4 = "tier2_2006_modelled_ingestion"   # enteric fermentation
manure_ch4 = "ipcc_tier2"                          # manure CH4 (MCF chain)
manure_n2o = "ipcc_tier2"                          # manure N2O (housing/storage/spreading)
soil_n2o = "ipcc_2019"                             # soil N2O (direct + indirect)
soil_carbon = "ipcc_stock_change"                  # soil C stock change
purchases = "agribalyse_ecoinvent"                 # upstream inputs (Agram)
fieldwork = "fuel_ademe"                           # fieldwork fuel

# One-slot sweeps: each variant runs at central values and in
# Monte-Carlo. Variants requiring measurements the farm does not
# have are excluded automatically (with a warning).
[variant_grid]
enteric_ch4 = [
    "tier2_2006_modelled_ingestion",
    "tier2_2006_measured_ingestion",
    "tier2_2019_modelled_ingestion",
    "tier2_2019_measured_ingestion",
    "tier2_fao_ym_modelled_ingestion",
    "tier2_fao_ym_measured_ingestion",
    "tier3_mills_modelled_ingestion",
    "tier3_mills_measured_ingestion",
    "tier3_sauvant2011_modelled_ingestion",
    "tier3_sauvant2011_measured_ingestion",
    "measured_ahcs",
]
manure_ch4 = ["ipcc_tier2", "tier3_eugene2019"]

# Coherent scenarios run in addition to the one-slot sweeps.
[study.named_combinations]
# INRA Tier-3 chain: the digestible OM produces the enteric CH4,
# the non-digestible OM goes to the manure.
inra_tier3 = { enteric_ch4 = "tier3_sauvant2011_modelled_ingestion", manure_ch4 = "tier3_eugene2019" }
# Same chain on the measured rations (ration sheets + GreenFeed
# monitoring of this farm).
inra_tier3_measured_ingestion = { enteric_ch4 = "tier3_sauvant2011_measured_ingestion", manure_ch4 = "tier3_eugene2019" }

[monte_carlo]
n_iterations = 500
seed = 2024

[datastore]
path = "results.json"
