[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pblca"
version = "0.1.0"
description = "Process-Based LCA Engine for mixed crop-livestock farms (ISO 14040/14044)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pdoc>=14.0"]

[tool.setuptools.packages.find]
include = ["pblca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
