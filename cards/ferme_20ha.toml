# Study card: 20 ha mixed crop-livestock farm, Tier-2 vs Tier-3 models.
#
# One file = one reproducible study: the farm, the model variants to
# test and the Monte-Carlo plan all live here. Run it with:
#
#     pblca run cards/ferme_20ha.toml

[study]
name = "ferme_20ha"
# Built-in farm shipped with the package (pblca.case_study.FERME_20HA).
farm = "ferme_20ha"

# Variants used for the central run (slots left out keep the
# registry default). Use `pblca slots` to list every variant.
[model_selection]
enteric_ch4 = "tier2_2006_modelled_ingestion"

# One-slot sweeps: each variant runs at central values and in
# Monte-Carlo. Variants requiring measurements the farm does not
# have are excluded automatically (with a warning).
[variant_grid]
enteric_ch4 = [
    "tier2_2006_modelled_ingestion",
    "tier2_2019_modelled_ingestion",
    "tier3_mills_modelled_ingestion",
    "tier3_sauvant2011_modelled_ingestion",
]
manure_ch4 = ["ipcc_tier2", "tier3_eugene2019"]

# Coherent scenarios run in addition to the one-slot sweeps.
[study.named_combinations]
inra_tier3 = { enteric_ch4 = "tier3_sauvant2011_modelled_ingestion", manure_ch4 = "tier3_eugene2019" }

# Paired multi-slot grid (one draw per iteration, every swept
# column evaluated with this same draw): the paired differences
# isolate the pure effect of each model choice. full_factorial =
# true sweeps the Cartesian product of the variants instead.
# [paired_grid]
# full_factorial = false
#
# [paired_grid.slots]
# enteric_ch4 = ["tier2_2006_modelled_ingestion", "tier3_mills_modelled_ingestion"]
# manure_ch4 = ["ipcc_tier2"]
#
# [paired_grid.main_selection]
# enteric_ch4 = "tier2_2006_modelled_ingestion"

[monte_carlo]
n_iterations = 500
seed = 2024

[datastore]
path = "results.json"
